name: Dev PR CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint "lib/**/*.ts"

      - name: ABI modules are in sync
        run: node scripts/gen-abi.mjs && git diff --exit-code -- lib/types/abi/generated.ts

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Assert published entrypoints load
        run: |
          node -e "const m=require('./dist/lib/index.js'); if(!Object.keys(m).length) throw new Error('CJS entrypoint exports nothing'); console.log('CJS OK:', Object.keys(m).length, 'exports')"
          node --input-type=module -e "const m=await import('./dist/esm/index.js'); if(!Object.keys(m).length) throw new Error('ESM entrypoint exports nothing'); console.log('ESM OK:', Object.keys(m).length, 'exports')"
