name: SDK RC Publish

on:
  workflow_dispatch:
    inputs:
      run-mode:
        description: '실행 모드 (all: CI+CD, ci: CI만, cd: CD만)'
        type: choice
        options:
          - all
          - ci
          - cd
        default: 'all'
      version:
        description: '버전 (예: 1.2.0-rc.1). 태그 트리거 시 자동 추출'
        type: string
        required: true
  push:
    tags: ['v*-rc.*']

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  ci:
    if: ${{ inputs.run-mode != 'cd' }}
    uses: baerae-zkap/zkap-workflows/.github/workflows/sdk-rc-ci.yml@main
    with:
      package-manager: npm
      version: ${{ inputs.version }}
    secrets: inherit

  cd:
    needs: [ci]
    if: ${{ !cancelled() && inputs.run-mode != 'ci' && (needs.ci.result == 'success' || inputs.run-mode == 'cd') }}
    uses: baerae-zkap/zkap-workflows/.github/workflows/sdk-rc-cd.yml@main
    with:
      skip-artifact-download: ${{ inputs.run-mode == 'cd' }}
      version: ${{ inputs.version }}
    secrets: inherit
