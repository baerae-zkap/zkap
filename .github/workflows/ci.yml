name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage/coverage.txt

      - name: Check coverage thresholds
        if: always()
        id: coverage_check
        continue-on-error: true
        run: |
          echo "Checking if coverage meets thresholds..."
          if grep -q "Jest: \"global\" coverage threshold" coverage/coverage.txt; then
            echo "❌ Coverage thresholds not met!"
            echo "threshold_met=false" >> $GITHUB_OUTPUT
            grep "Jest: \"global\" coverage threshold" coverage/coverage.txt | tee coverage/threshold-status.txt
            exit 1
          else
            echo "✅ All coverage thresholds met!"
            echo "threshold_met=true" >> $GITHUB_OUTPUT
            echo "✅ All coverage thresholds met!" > coverage/threshold-status.txt
            exit 0
          fi

      - name: Add threshold status to PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const thresholdMet = '${{ steps.coverage_check.outputs.threshold_met }}' === 'true';

            let statusMsg = '';
            if (thresholdMet) {
              statusMsg = '## ✅ Coverage Thresholds: PASSED\n\nAll coverage targets have been met!';
            } else {
              const thresholdStatus = fs.readFileSync('coverage/threshold-status.txt', 'utf8');
              statusMsg = '## ❌ Coverage Thresholds: FAILED\n\n```\n' + thresholdStatus + '\n```\n\n**Merge is blocked until coverage targets are met.**';
            }

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Coverage Thresholds:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: statusMsg
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: statusMsg
              });
            }

      - name: Post coverage comment to PR
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 📊 테스트 커버리지 리포트
          summary-title: 📈 커버리지 요약
          badge-title: Coverage
          coverage-title: 📁 파일별 커버리지
          coverage-summary-path: ./coverage/coverage-summary.json
          coverage-path: ./coverage/coverage.txt
          junitxml-path: ./coverage/junit.xml
          junitxml-title: 🧪 테스트 결과
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false
          remove-links-to-files: true
          unique-id-for-comment: coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Fail if coverage thresholds not met
        if: steps.coverage_check.outputs.threshold_met == 'false'
        run: |
          echo "❌ Workflow failed: Coverage thresholds not met"
          exit 1
