name: SDK Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.2.0). Auto-extracted from tag on tag push.'
        type: string
        required: false
      skip-tests:
        description: 'Skip tests and build (use when re-running publish step only)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write  # required for npm OIDC Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify version is newer than published
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PKG_NAME=$(node -p "require('./package.json').name")
          LATEST=$(npm view "$PKG_NAME" dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No published version found on npmjs.com. Proceeding with first publish."
          else
            echo "Current latest: $LATEST"
            if [ "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$VERSION" = "$LATEST" ]; then
              echo "::error::$VERSION is not newer than current latest $LATEST"
              exit 1
            fi
            echo "Version $VERSION > $LATEST. Proceeding."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: ${{ !inputs.skip-tests }}
        run: npx tsc --noEmit

      - name: Run tests
        if: ${{ !inputs.skip-tests }}
        run: npm test -- --ci --forceExit

      - name: Build
        if: ${{ !inputs.skip-tests }}
        run: npm run build

      - name: Publish dry-run
        run: npm publish --dry-run

      - name: Publish to npm
        # Uses OIDC Trusted Publishing — no NPM_TOKEN secret needed.
        # Configured at: npmjs.com/package/@baerae/zkap/access
        run: |
          npm pkg delete scripts.prepare 2>/dev/null || true
          echo "Publishing v${{ steps.version.outputs.value }} to npmjs.com"
          npm publish --access public --tag latest --provenance
