name: SDK Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.2.0). Auto-extracted from tag on tag push.'
        type: string
        required: false
      skip-tests:
        description: 'Skip tests and build (use when re-running publish step only)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write  # required for npm OIDC Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify package.json version matches release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release version ($VERSION). Bump package.json and re-tag."
            exit 1
          fi
          echo "package.json version matches release version: $PKG_VERSION"

      - name: Verify version is newer than published
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PKG_NAME=$(node -p "require('./package.json').name")
          LATEST=$(npm view "$PKG_NAME" dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No published version found on npmjs.com. Proceeding with first publish."
          else
            echo "Current latest: $LATEST"
            if [ "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$VERSION" = "$LATEST" ]; then
              echo "::error::$VERSION is not newer than current latest $LATEST"
              exit 1
            fi
            echo "Version $VERSION > $LATEST. Proceeding."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC Trusted Publishing requires npm >= 11.5.1)
        # npm@11 pinned: npm@12+ requires Node >= 22, which EBADENGINEs on this
        # runner's Node 20 (`npm@latest` broke the v0.1.8 publish this way).
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: ${{ !inputs.skip-tests }}
        run: npx tsc --noEmit

      - name: Run tests
        if: ${{ !inputs.skip-tests }}
        run: npm test -- --ci --forceExit

      # Never gated: dist/ is gitignored, so skipping the build would publish a
      # tarball whose main/module/types point at nothing.
      - name: Build
        run: npm run build

      - name: Assert published entrypoints load
        shell: bash
        run: |
          node -e "const m=require('./dist/lib/index.js'); if(!Object.keys(m).length) throw new Error('CJS entrypoint exports nothing'); console.log('CJS OK:', Object.keys(m).length, 'exports')"
          node --input-type=module -e "const m=await import('./dist/esm/index.js'); if(!Object.keys(m).length) throw new Error('ESM entrypoint exports nothing'); console.log('ESM OK:', Object.keys(m).length, 'exports')"
          node -e "const fs=require('fs'),p=require('./package.json'); if(!fs.existsSync(p.types)) throw new Error('missing types: '+p.types); console.log('types OK:', p.types)"

      - name: Publish dry-run
        run: npm publish --dry-run

      - name: Publish to npm
        # Uses OIDC Trusted Publishing — no NPM_TOKEN secret needed.
        # Configured at: npmjs.com/package/@baerae/zkap-aa/access
        # NODE_AUTH_TOKEN must be unset to avoid conflicting with OIDC flow.
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          npm pkg delete scripts.prepare 2>/dev/null || true
          echo "Publishing v${{ steps.version.outputs.value }} to npmjs.com"
          npm publish --access public --tag latest --provenance
